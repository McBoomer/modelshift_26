[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelshift"
version = "0.1.0"
description = "Migrate production LLM apps between models without silent regressions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]
experiments = ["pyyaml>=6"]

[project.scripts]
modelshift = "modelshift.cli:main"

[tool.setuptools]
packages = ["modelshift"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
